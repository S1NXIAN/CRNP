<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crates N' Plates — system flow</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 2rem clamp(1rem, 4vw, 3rem);
    font: 15px/1.5 system-ui, sans-serif;
    background: #f6f2ea; color: #211b14;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  #status { font-size: .8rem; font-weight: 400; color: #8a7f70; }
  #diagram { overflow-x: auto; margin-top: 1.5rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #14110d; color: #f0e8d8; }
    #status { color: #94887a; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body>
<h1>Crates N' Plates — system flow <span id="status">loading…</span></h1>
<div id="diagram"></div>
<script>
"use strict";
const PLAN = "README.md";
// Fallback = the mermaid block currently in README.md; used only when
// opened via file:// (browsers block fetch of local files).
const DEFAULT = `
flowchart TD
  DB[("Firebase RTDB — sole datastore")]

  subgraph CU["Customer · / (browse only · no login)"]
    C1["Menu · product pages · open status<br/>announcement · promo (auto-calc) / favorite / top-3 tags<br/>about / branches"]
  end

  subgraph CA["Cashier · /cashier (POS)"]
    P1["Ring up walk-in order"] --> P2["Receipt"] --> P3["Mark served"]
    R1["New reservation<br/>dine-in / function room / catering"] --> R2{"Date-time conflict?"}
    R2 -->|"no"| R3["Confirmed → calendar"]
    R2 -->|"yes"| R4["Rejected: duplicate / conflict"]
  end

  subgraph KI["Kitchen · /kitchen (read-only · secret URL · no login)"]
    K1["Ticket + age timer<br/>NEW count · all-day counts<br/>5–10 s refresh"]
  end

  subgraph AD["Admin · /admin"]
    A1["Sales analytics dashboard"]
    A2["Inventory: stock & low-stock"]
    A3["Reports: sales + reservations"]
  end

  C1 -.->|"reads menu · hours · promos · top-3"| DB
  P1 --> DB
  R2 -.->|"conflict check"| DB
  DB --> K1
  K1 -.->|"auto-clears when served"| P3
  DB --> A1
  DB --> A2
  DB --> A3
`.trim();

mermaid.initialize({ startOnLoad: false, theme: "neutral" });

const statusEl = document.getElementById("status");
const diagramEl = document.getElementById("diagram");
let lastRendered = null;
let renderSeq = 0;

async function render(src) {
  const id = "flow" + (++renderSeq);
  try {
    const { svg } = await mermaid.render(id, src);
    diagramEl.innerHTML = svg;
    lastRendered = src;
    return true;
  } catch (err) {
    statusEl.textContent = "mermaid error: " + err.message;
    return false;
  }
}

async function tick() {
  let src = null;
  try {
    const res = await fetch(PLAN, { cache: "no-store" });
    if (res.ok) {
      const text = await res.text();
      // \x60 = backtick, kept out of the template literal
      const m = text.match(new RegExp("\\x60{3}mermaid\\n([\\s\\S]*?)\\x60{3}"));
      src = m ? m[1].trim() : null;
      if (src && src !== lastRendered && (await render(src))) {
        statusEl.textContent = "live · synced " + new Date().toLocaleTimeString();
      } else if (!src) {
        statusEl.textContent = "no mermaid block in README.md";
      }
      return;
    }
    throw new Error("HTTP " + res.status);
  } catch (err) {
    if (location.protocol === "file:") {
      if (lastRendered === null) {
        await render(DEFAULT);
      }
      statusEl.textContent =
        "static preview (file:// blocks fetch) — serve this folder over HTTP for live sync";
    } else if (lastRendered === null) {
      await render(DEFAULT);
      statusEl.textContent = "can't reach README.md — showing embedded copy";
    } else {
      statusEl.textContent = "retrying (" + err.message + ")…";
    }
  }
}

tick();
setInterval(tick, 5000);
</script>
</body>
</html>
