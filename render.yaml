# Render Blueprint — CRATES N' PLATES
# Deploy: Render Dashboard -> New -> Blueprint -> point at this repo,
# then fill the `sync: false` values when prompted.
services:
  - type: web
    name: crnp-web
    runtime: docker          # builds from ./Dockerfile (php:8.2-apache, EXPOSE 80)
    plan: free               # spins down after ~15 min idle (slow first hit); uploads/ is ephemeral
    healthCheckPath: /health.php
    autoDeploy: true         # redeploy on every push to the tracked branch
    envVars:
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MAIL_FROM # optional; defaults to GMAIL_ADDRESS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON # full service-account JSON key
        sync: false
      - key: DEV_SHOW_OTP # "1" prints OTPs on screen; keep "0" in production
        value: "0"
